<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Booking Pass</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 20px;
      width: 70vw;
      max-width: 2000px;
      box-sizing: border-box;
      text-align: center;
    }
    .active {
      background-color: #4F615C;
      border-color: #4F615C;
      color: #fff;
    }
    .inactive {
      background-color: #fff;
      border-color: #ccc;
      color: #333;
    }
    h3 {
      font-size: 6vw;
      margin: 10px 0;
    }
    h4 {
      font-size: 4vw;
      margin: 15px 0 10px 0;
    }
    p {
      font-size: 4vw;
      margin: 8px 0;
    }
    img {
      width: 100%;
      border-radius: 15px;
      margin-top: 25px;
    }
   #currentDateTime {
     font-size: 3.2vw;
     margin: 8px 0 0 0;
     opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="bookingCard">Loading your pass...</div>
  </div>

  <script>
    $(async function () {
        function getParameterByName(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            const regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)");
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        function formatDateTime(datetimeString) {
            const date = new Date(datetimeString);
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${day}/${month}/${year}, ${hours}:${minutes}`;
        }

        async function repairLegacyPassportUrl() {
            $('#bookingCard').html(`
                <div class="card inactive">
                    <h3>Refreshing Café Gardens Pass…</h3>
                    <p>Please wait a moment.</p>
                </div>
            `);

            try {
                const response = await fetch('/api/repair-passport-url?t=' + Date.now(), {
                    method: 'POST',
                    cache: 'no-store'
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.ok) {
                    throw new Error(data.error || 'Unable to refresh the pass link');
                }

                $('#bookingCard').html(`
                    <div class="card inactive">
                        <p>Error loading pass: to restore, please fully close and reopen the Passport app, then open Café Gardens Pass again.</p>
                    </div>
                `);
            } catch (err) {
                console.error('[pass] URL repair failed', err);
                $('#bookingCard').html(`
                    <div class="card inactive">
                        <h3>Pass temporarily unavailable</h3>
                        <p>Please close this page and try Café Gardens Pass again shortly.</p>
                    </div>
                `);
            }
        }

        const pageUrl = new URL(window.location.href);
        const coworkerId = getParameterByName('coworkerid');
        const userId = getParameterByName('userid');

        // Legacy Passport occasionally persists a resolved/broken custom-page URL,
        // leaving userid blank and appending one or more hash parameters. Catch that
        // before the normal booking request so the user never sees a technical error.
        const legacyUseridPresent = pageUrl.searchParams.has('userid');
        const legacyUseridValid = /^\d+$/.test(String(userId || ''));
        const looksLikeBrokenLegacyUrl =
            !coworkerId &&
            ((legacyUseridPresent && !legacyUseridValid) ||
             (!legacyUseridPresent && pageUrl.searchParams.has('hash')));

        if (looksLikeBrokenLegacyUrl) {
            await repairLegacyPassportUrl();
            return;
        }

        if (!coworkerId && !userId) {
            $('#bookingCard').html("Missing user identifier.");
            return;
        }

        async function generateHash(userid, secret) {
            const encoder = new TextEncoder();
            const key = await crypto.subtle.importKey(
                "raw",
                encoder.encode(secret),
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );
            const signature = await crypto.subtle.sign("HMAC", key, encoder.encode(String(userid).trim()));
            return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let apiUrl;

        if (coworkerId) {
            apiUrl =
                '/api/get-bookingsv5?coworkerid=' +
                encodeURIComponent(coworkerId) +
                '&t=' + Date.now();
        } else {
            apiUrl =
                '/api/get-bookings?userid=' +
                encodeURIComponent(userId) +
                '&t=' + Date.now();
        }

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    $('#bookingCard').html("Error: " + data.error);
                    return;
                }

                // Handle dedicated desk case
                if (data.dedicatedDesk) {
                    $('#bookingCard').html(`
                        <div class="card active">
                            <h3>Dedicated Desk Member</h3>
                            <p id="currentDateTime"></p>
                            <img src="assets/images/coffee-in-plants.jpeg" alt="Coffee Image">
                        </div>
                    `);
                    $('#currentDateTime').text(formatDateTime(new Date()));
                    return;
                }

                if (data.bookings.length === 0) {
                    $('#bookingCard').html(`<div class="card inactive"><h3>No Current Booking</h3></div>`);
                    return;
                }

                const now = new Date();
                const marginMinutes = 15;
                const activeBooking = data.bookings.find(booking => {
                    const start = new Date(booking.FromTime);
                    const end = new Date(booking.ToTime);
                    const startMargin = new Date(start.getTime() - marginMinutes * 60000);
                    const endMargin = new Date(end.getTime() + marginMinutes * 60000);
                    return now >= startMargin && now <= endMargin;
                });

                if (activeBooking) {
                    $('#bookingCard').html(`
                        <div class="card active">
                            <h3>Garden & Café Pass Active</h3>
                            <h4>Booking Details:</h4>
                            <p><strong>Name:</strong> ${activeBooking.CoworkerFullName || 'N/A'}</p>
                            <p><strong>Resource:</strong> ${activeBooking.ResourceName}</p>
                            <p><strong>Start:</strong> ${formatDateTime(activeBooking.FromTime)}</p>
                            <p><strong>End:</strong> ${formatDateTime(activeBooking.ToTime)}</p>
                            <img src="assets/images/coffee-in-plants.jpeg" alt="Coffee Image">
                        </div>
                    `);
                } else {
                    $('#bookingCard').html(`<div class="card inactive"><h3>No Current Booking</h3></div>`);
                }
            })
            .catch(err => {
                console.error(err);
                $('#bookingCard').html("Error loading bookings.");
            });
    });
  </script>
</body>
</html>
